{%- comment -%}
Check product price and stock to show badges like:
- "Budget Pick" if price < ₹500
- "Limited Stock" if inventory < 5
- Both if both conditions are true
{%- endcomment -%}
{% assign price_in_rupees = product.price | divided_by: 100 %}

{% if price_in_rupees < 500 or product.variants.first.inventory_quantity < 5 %}
  <div class="custom-badges">
    {% if price_in_rupees < 500 %}
      <span class="badge badge--budget">Budget Pick</span>
    {% endif %}
    {% if product.variants.first.inventory_quantity < 5 %}
      <span class="badge badge--limited">Limited Stock</span>
    {% endif %}
  </div>
{% endif %}

